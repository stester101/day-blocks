<!doctype html>
<html lang="en-GB"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Day Blocks</title>
<meta name="description" content="Plan your day in blocks. Drag tasks from the inbox onto the day.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="icon" href="icons/icon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="theme-color" content="#FAFAF7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141914" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Day Blocks">
<meta name="format-detection" content="telephone=no">
<script src="config.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Fraunces:wght@300;400&family=Lexend:wght@400;500&family=Manrope:wght@400;500;600;700&display=swap">
<style>
/* Layout: iPad and browser = inbox rail + day/week timeline. Phone = day strip, timeline, inbox tray, bottom tabs. Sprig tokens + ux-library motion. */
:root{
  --bg:#FAFAF7;--surface:#FFFFFF;--sunken:#F2F3EE;--line:#E4E6DF;--line-strong:#8E9388;
  --text:#22261F;--muted:#6D7268;--heading:#22512F;
  --primary:#357545;--primary-hover:#22512F;--on-primary:#FFFFFF;--on-error:#FFFFFF;--primary-soft:#EEF6F0;--on-primary-soft:#357545;
  --secondary-soft:#F6EBCB;--on-secondary-soft:#7A5E17;--tertiary-soft:#FBEEEE;--on-tertiary-soft:#7E3B3B;
  --info:#3F6E91;--info-soft:#EAF1F7;--error:#B4463F;--error-soft:#FBEDEC;--focus:#4C9A5E;
  --lav-soft:#EFEAF7;--on-lav:#5B4A8A;--clay-soft:#FAEBDD;--on-clay:#8A4B1F;--teal-soft:#E2F3F1;--on-teal:#1F6B66;--slate-soft:#E9ECEF;--on-slate:#46505A;
  --glow:rgba(53,117,69,.14);
  --shadow-sm:0 1px 2px rgba(34,81,47,.08);
  --shadow-md:0 1px 2px rgba(34,81,47,.06),0 6px 16px rgba(34,81,47,.08);
  --shadow-lg:0 2px 4px rgba(34,81,47,.06),0 16px 40px rgba(34,81,47,.14);
  --display:Lexend,system-ui,sans-serif;--body:Manrope,system-ui,sans-serif;--mono:"DM Mono",ui-monospace,monospace;--serif:Fraunces,Georgia,serif;
  --smooth:cubic-bezier(.65,0,.35,1);--out:cubic-bezier(.2,.8,.2,1);--spring:cubic-bezier(.3,1.3,.5,1);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141914;--surface:#1C221C;--sunken:#111511;--line:#2D352D;--line-strong:#6B7569;
  --text:#E6EBE3;--muted:#A3AB9F;--heading:#BEDDC4;
  --primary:#7DBA8A;--primary-hover:#9DCBA7;--on-primary:#132A19;--on-error:#2A0F0D;--primary-soft:#24382A;--on-primary-soft:#BEDDC4;
  --secondary-soft:#3A3115;--on-secondary-soft:#EFD99A;--tertiary-soft:#3D2626;--on-tertiary-soft:#EBB9B9;
  --info:#8FB3CF;--info-soft:#1D2A35;--error:#E58A83;--error-soft:#3A2220;--focus:#9DCBA7;
  --lav-soft:#2C2540;--on-lav:#CFC3EE;--clay-soft:#3D2C1D;--on-clay:#F0C9A4;--teal-soft:#1B3533;--on-teal:#A5DDD7;--slate-soft:#262B30;--on-slate:#BFC8D0;
  --glow:rgba(157,203,167,.16);
  --shadow-sm:0 1px 2px rgba(0,0,0,.4);--shadow-md:0 1px 2px rgba(0,0,0,.3),0 6px 16px rgba(0,0,0,.35);
  --shadow-lg:0 2px 4px rgba(0,0,0,.35),0 16px 40px rgba(0,0,0,.5);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141914;--surface:#1C221C;--sunken:#111511;--line:#2D352D;--line-strong:#6B7569;
  --text:#E6EBE3;--muted:#A3AB9F;--heading:#BEDDC4;
  --primary:#7DBA8A;--primary-hover:#9DCBA7;--on-primary:#132A19;--on-error:#2A0F0D;--primary-soft:#24382A;--on-primary-soft:#BEDDC4;
  --secondary-soft:#3A3115;--on-secondary-soft:#EFD99A;--tertiary-soft:#3D2626;--on-tertiary-soft:#EBB9B9;
  --info:#8FB3CF;--info-soft:#1D2A35;--error:#E58A83;--error-soft:#3A2220;--focus:#9DCBA7;
  --lav-soft:#2C2540;--on-lav:#CFC3EE;--clay-soft:#3D2C1D;--on-clay:#F0C9A4;--teal-soft:#1B3533;--on-teal:#A5DDD7;--slate-soft:#262B30;--on-slate:#BFC8D0;
  --glow:rgba(157,203,167,.16);
  --shadow-sm:0 1px 2px rgba(0,0,0,.4);--shadow-md:0 1px 2px rgba(0,0,0,.3),0 6px 16px rgba(0,0,0,.35);
  --shadow-lg:0 2px 4px rgba(0,0,0,.35),0 16px 40px rgba(0,0,0,.5);color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font:400 16px/1.4 var(--body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-top:max(12px,env(safe-area-inset-top,0px));padding-bottom:max(12px,env(safe-area-inset-bottom,0px));overflow:hidden;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
html{background:var(--bg)}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}

#app{position:relative;height:100%;display:flex;flex-direction:column;gap:12px}
header{display:flex;align-items:center;gap:8px 16px;flex-wrap:wrap}
.ttl{flex:1 1 220px;min-width:0}
.eyebrow{font:400 12px/16px var(--mono);letter-spacing:.04em;color:var(--primary);text-transform:lowercase}
h1{font:500 28px/34px var(--display);letter-spacing:-.01em;margin:0;color:var(--heading)}
.sum{font:400 12px/16px var(--mono);color:var(--muted);margin-top:2px}
.dbar{display:flex;height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin-top:6px;max-width:340px}
.dbar i{display:block;height:100%;background:var(--cf);transition:width .6s var(--smooth)}
.nextup{display:block;margin-top:6px;padding:0;border:0;background:none;font:500 12px/16px var(--mono);color:var(--primary);text-align:left;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nextup:hover{text-decoration:underline}
.dnav,.seg{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px}
.seg{position:relative;display:grid;grid-template-columns:1fr 1fr}
.seg .th{position:absolute;top:4px;bottom:4px;left:4px;width:calc((100% - 8px)/2);background:var(--primary-soft);border-radius:8px;transform:translateX(calc(var(--i,0)*100%));transition:transform .4s var(--spring)}
.seg .btn{position:relative;z-index:1}
.actions{display:flex;gap:8px;align-items:center}
.btn{min-height:44px;min-width:44px;padding:0 16px;border-radius:10px;border:1px solid var(--line-strong);background:var(--surface);
  font-weight:600;font-size:14px;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:background-color .3s var(--smooth),color .3s var(--smooth),transform .2s var(--out)}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.4;cursor:default}
.btn[aria-pressed="true"]{background:var(--primary-soft);border-color:var(--primary);color:var(--on-primary-soft)}
.dnav .btn,.seg .btn{border:0;background:transparent;min-height:40px}
.seg .btn[aria-pressed="true"]{background:transparent;color:var(--text)}
@media (hover:hover){.dnav .btn:hover,.btn:not(.leaf):not(:disabled):hover{background:var(--primary-soft)}.seg .btn:hover{background:transparent}}
.leaf{background:var(--primary);color:var(--on-primary);border-color:var(--primary);border-radius:14px 3px 14px 14px;padding:0 20px}
@media (hover:hover){.leaf:hover{background:var(--primary-hover)!important}}
.leaf:active{background:var(--primary-hover)}
.danger{color:var(--error);border-color:var(--error)}
.chip{font:400 12px/16px var(--mono);color:var(--muted);white-space:nowrap}
.chip.bad{color:var(--error)}
#todayM,#fab,#tabbar,#dstrip,#ag{display:none}

main{flex:1;min-height:0;display:grid;grid-template-columns:300px minmax(0,1fr);gap:16px}
#inbox{display:flex;flex-direction:column;gap:12px;min-height:0;background:var(--sunken);border:1px solid var(--line);border-radius:12px;padding:16px;transition:background-color .3s var(--smooth),border-color .3s var(--smooth)}
#inbox.over{background:var(--primary-soft);border-color:var(--primary)}
.ihead{display:flex;align-items:baseline;justify-content:space-between}
h2{font:500 20px/26px var(--display);margin:0}
.cnt{font:400 12px/16px var(--mono);color:var(--muted)}
#qa{display:flex;gap:8px}
#qaTitle{flex:1;min-width:0;min-height:44px;padding:0 12px;border-radius:10px;border:1px solid var(--line-strong);background:var(--surface);font-size:16px;transition:border-color .3s var(--smooth),box-shadow .3s var(--smooth)}
#qaTitle:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
.qrow{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center}
.qopts{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.pill{min-height:36px;padding:0 12px;border-radius:10px;border:1px solid var(--line-strong);background:var(--surface);font:500 13px/1 var(--mono);transition:background-color .3s var(--smooth),border-color .3s var(--smooth),color .3s var(--smooth)}
.pill[aria-pressed="true"]{background:var(--primary-soft);border-color:var(--primary);color:var(--text);font-weight:500}
.pill.tick,.cdot.tick,.dp.tick{animation:tick .5s var(--spring)}
@keyframes tick{0%{transform:none}35%{transform:rotate(-5deg) scale(1.08)}100%{transform:none}}
.sheet .pill{min-height:44px}
.cdot{width:36px;height:36px;border-radius:999px;border:2px solid transparent;padding:0;background:var(--cb);box-shadow:inset 0 0 0 5px var(--cf)}
.cdot[aria-pressed="true"]{border-color:var(--bg);outline:2px solid var(--text);outline-offset:1px}
.cdot.more{background:transparent;box-shadow:none;border:2px dashed var(--line-strong);color:var(--muted);font-weight:700;font-size:18px;line-height:1}
.pill.tc{background:var(--cb);color:var(--cf);border-color:var(--line)}
.pill.tc[aria-pressed="true"]{border:2px solid var(--text);background:var(--cb);color:var(--cf)}
.tlist{display:flex;flex-direction:column;gap:12px}
.trow{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding-bottom:12px;border-bottom:1px solid var(--line)}
.trow.tpl{padding-bottom:8px}
.trow .nm{flex:1;min-width:0;font-weight:600;font-size:14px}
.trow .nm small{display:block;font:400 12px/16px var(--mono);color:var(--muted)}
.tname{flex:1;min-width:140px;min-height:44px;padding:0 12px;border-radius:10px;border:1px solid var(--line-strong);background:var(--surface);font-size:16px}
.tsw{width:100%}
#icards{display:flex;flex-direction:column;gap:8px;overflow-y:auto;min-height:0;flex:1;padding:2px}
.empty{font-size:14px;color:var(--muted);margin:0}
.zero{text-align:center;padding:16px 8px;margin:auto 0}
.zero .z{font:300 88px/1 var(--serif);color:var(--primary);opacity:.35}
.zero p{margin:6px 0 0;color:var(--muted);font-size:14px}
.hint{font-size:13px;color:var(--muted);margin:0;display:flex;gap:8px;align-items:center;justify-content:space-between}
.hint button{min-height:36px;padding:0 12px;border-radius:10px;border:1px solid var(--line-strong);background:var(--surface);font-weight:600;font-size:13px;flex:none}

.k-leaf{--cb:var(--primary-soft);--cf:var(--on-primary-soft)}
.k-sky{--cb:var(--info-soft);--cf:var(--info)}
.k-rose{--cb:var(--tertiary-soft);--cf:var(--on-tertiary-soft)}
.k-mustard{--cb:var(--secondary-soft);--cf:var(--on-secondary-soft)}
.k-lavender{--cb:var(--lav-soft);--cf:var(--on-lav)}
.k-clay{--cb:var(--clay-soft);--cf:var(--on-clay)}
.k-teal{--cb:var(--teal-soft);--cf:var(--on-teal)}
.k-slate{--cb:var(--slate-soft);--cf:var(--on-slate)}
.card,.blk{background-color:var(--cb);color:var(--cf);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow-sm);
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;cursor:grab;
  transition:opacity .7s var(--out),transform .25s var(--out),box-shadow .3s var(--smooth)}
.card:active,.blk:active{transform:scale(.985)}
@media (hover:hover){
  .card,.blk{background-image:radial-gradient(180px circle at var(--mx,-400px) var(--my,-400px),var(--glow),transparent 70%)}
  .card:hover,.blk:hover{box-shadow:var(--shadow-md)}
}
.card{padding:10px 12px;min-height:56px;flex:none}
.tt{width:fit-content;max-width:100%;font-weight:600;font-size:14px;line-height:20px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  background:linear-gradient(currentColor,currentColor) 0 58%/0 1.5px no-repeat;transition:background-size .7s var(--out)}
.blk.done .tt,.agr.done .tt{background-size:100% 1.5px}
.tm{font:400 12px/16px var(--mono);opacity:.9}
.nt{font-size:12px;line-height:16px;opacity:.85;margin-top:2px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.lifted{opacity:.3}
.settle{animation:settle .5s var(--spring)}
@keyframes settle{0%{transform:scale(.96)}60%{transform:scale(1.02)}100%{transform:none}}
.growin{animation:growin .5s var(--spring)}
@keyframes growin{0%{opacity:0;transform:scale(.9)}100%{opacity:1;transform:none}}
.slide-l{animation:slidel .4s var(--out)}.slide-r{animation:slider .4s var(--out)}
@keyframes slidel{from{opacity:0;transform:translateX(28px)}to{opacity:1;transform:none}}
@keyframes slider{from{opacity:0;transform:translateX(-28px)}to{opacity:1;transform:none}}

#tl,#wk{min-height:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;box-shadow:var(--shadow-md)}
#wk{display:flex;flex-direction:column}
#scroller,#wscroller{overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;position:relative}
#scroller{height:100%}
#wscroller{flex:1;min-height:0}
#grid,#wgrid{position:relative;margin-block:10px}
.hl{position:absolute;left:0;right:0;border-top:1px solid var(--line)}
.hl.half{border-top-style:dashed;opacity:.6}
.hl span{position:absolute;left:12px;top:-8px;font:400 12px/16px var(--mono);color:var(--muted);background:var(--surface);padding:0 4px}
#wlines .hl span{left:2px}
#blocks{position:absolute;left:68px;right:12px;top:0;bottom:0}
.dayzero{position:absolute;left:0;right:0;top:120px;pointer-events:none}
.blk{position:absolute;display:flex;gap:8px;align-items:flex-start;padding:5px 8px;overflow:hidden;touch-action:pan-y}
.blk .bt{min-width:0;flex:1}
.blk.sm{align-items:center;padding-block:0}
.blk.sm .bt{display:flex;gap:8px;align-items:baseline}
.blk.sm .tm{white-space:nowrap}
.blk.nar .tm,.blk.nar .rep,.blk.nar .nt{display:none}.blk.nar .tt{font-size:12px}
.blk.nar .ck{flex:none;transform:scale(.8);margin-inline:-5px -3px}.blk.nar .bt{min-width:0}
.blk.done{opacity:.5;filter:saturate(.5)}
.blk,.agr{transition:opacity .6s var(--smooth),filter .6s var(--smooth),transform .3s var(--spring),box-shadow .3s var(--smooth)}
.rep{flex:none;opacity:.8;margin-left:auto;align-self:center;width:14px;height:14px}
.ck{flex:none;width:20px;height:20px;border-radius:999px;border:2px solid currentColor;background:transparent;padding:0;position:relative;display:grid;place-items:center;color:inherit;transition:background-color .4s var(--smooth)}
.ck::after{content:"";position:absolute;inset:-12px}
.ck .svg{width:12px;height:12px;stroke-width:3;stroke:var(--cb)}
.ck .svg path{stroke-dasharray:20;stroke-dashoffset:20;transition:stroke-dashoffset .45s var(--out)}
.ck[aria-pressed="true"]{background:currentColor}
.ck[aria-pressed="true"] .svg path{stroke-dashoffset:0}
.sm .rz::after,.sm .rzt::after{display:none}
.rzt{position:absolute;left:0;right:0;top:0;height:max(5px,min(16px,18%));touch-action:pan-y;cursor:ns-resize;z-index:1}
.rzt::after{content:"";position:absolute;left:50%;top:3px;width:28px;height:3px;margin-left:-14px;border-radius:2px;background:currentColor;opacity:.35}
.ck{z-index:2}
/* short blocks: resize handles straddle the edge so almost the whole block stays "grab to move" */
.blk.sm{overflow:visible}
.blk.sm .bt{overflow:hidden}
.blk.sm .rz{bottom:-4px;height:8px}
.blk.sm .rzt{top:-4px;height:8px}
.blk.xs .rz{bottom:-7px;height:9px}.blk.xs .rzt{top:-7px;height:9px}
.rz{position:absolute;left:0;right:0;bottom:0;height:max(5px,min(16px,18%));touch-action:pan-y;cursor:ns-resize}
.rz::after{content:"";position:absolute;left:50%;bottom:3px;width:28px;height:3px;margin-left:-14px;border-radius:2px;background:currentColor;opacity:.35}
.drop{position:absolute;left:0;right:0;border:2px dashed var(--primary);background:var(--primary-soft);opacity:.85;border-radius:10px;pointer-events:none;
  font:500 12px/16px var(--mono);color:var(--on-primary-soft);padding:4px 8px;z-index:4}
.ghost{position:fixed;left:0;top:0;z-index:200;pointer-events:none;box-shadow:var(--shadow-lg);cursor:grabbing;padding:8px 12px;display:block;width:240px;overflow:hidden}
#now,.wnow{position:absolute;height:0;border-top:2px solid var(--error);pointer-events:none;z-index:5}
#now{left:56px;right:0}
#now::before{content:"";position:absolute;left:-5px;top:-6px;width:10px;height:10px;border-radius:999px;background:var(--error)}
body.dragging,body.dragging *{cursor:grabbing!important}

.whead{display:grid;grid-template-columns:52px repeat(7,minmax(0,1fr));border-bottom:1px solid var(--line);flex:none}
.whd{min-height:52px;border:0;background:transparent;border-left:1px solid var(--line);padding:6px 4px;text-align:center;line-height:1.2}
.whd b{display:block;font:500 16px/20px var(--display)}
.whd span{font:400 11px/14px var(--mono);color:var(--muted)}
.whd.today b{color:var(--primary)}
.whd.today{background:var(--primary-soft)}
#wlines{position:absolute;inset:0}
#wcols{position:absolute;left:52px;right:0;top:0;bottom:0;display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.wcol{position:relative;border-left:1px solid var(--line)}
.wcol.today::before{content:"";position:absolute;inset:0;background:var(--primary-soft);opacity:.45;pointer-events:none}
.blk.wb{padding:2px 5px;gap:4px}
.wb .ck,.wb .tm,.wb .nt,.wb .rep{display:none}
.wb .tt{font-size:12px;line-height:15px;white-space:normal;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical}
.wb.sm .tt{-webkit-line-clamp:1}
.wb.done .tt{text-decoration:line-through;background:none}

/* agenda (phone week) */
#ag{overflow-y:auto;flex-direction:column;gap:10px;min-height:0;padding-bottom:12px;overscroll-behavior:contain}
.agd{display:flex;flex-direction:column;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px;animation:agin .45s var(--out) both;animation-delay:calc(var(--i,0)*35ms)}
@keyframes agin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.agd.today{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
.agh{display:flex;align-items:center;gap:12px;-webkit-user-select:none;user-select:none}
.agdt{display:flex;flex-direction:column;align-items:center;justify-content:center;width:48px;height:48px;flex:none;border-radius:12px;background:var(--bg);border:0;padding:0;color:var(--ink);cursor:pointer;transition:transform .2s var(--spring)}
.agdt:active{transform:scale(.94)}
.agdt small{font:500 11px/13px var(--mono);text-transform:lowercase;color:var(--muted)}
.agdt b{font:600 20px/22px var(--display)}
.agd.today .agdt{background:var(--primary);color:var(--on-primary)}.agd.today .agdt small{color:inherit;opacity:.85}
.agm{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.ags{font:400 12px/16px var(--mono);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.agbar{display:flex;height:6px;border-radius:3px;background:var(--bg);overflow:hidden}
.agbar i{display:block;height:100%;background:var(--cf)}
.agh .agadd{min-height:44px;min-width:44px;flex:none;border-radius:999px;border:1px solid var(--line-strong);background:var(--surface);padding:0;display:grid;place-items:center}
.agh .agadd:active{transform:scale(.92)}

<script>
(function(){
const $=s=>document.querySelector(s);
const PPM=84/60, PPMW=58/60;
const DEFSET={dayStart:360,dayEnd:1380,snap:15,h12:false};
let DAY_START=360,DAY_END=1380,SNAP=15;
const COLORS=['leaf','sky','rose','mustard','lavender','clay','teal','slate'];
const COLNAME={leaf:'Green',sky:'Blue',rose:'Rose',mustard:'Mustard',lavender:'Lavender',clay:'Clay',teal:'Teal',slate:'Slate'};
const DEFCATS=[{id:'focus',name:'Focus',color:'leaf'},{id:'meeting',name:'Meeting',color:'sky'},{id:'personal',name:'Personal',color:'rose'},{id:'admin',name:'Admin',color:'mustard'}];
const APP_VER='1.4.0';
const CFG=window.DAYBLOCKS_CONFIG||{};
const DURS=[15,30,45,60,90,120,180,240];

const KEY='day-blocks.v1',VKEY='day-blocks.view',TKEY='day-blocks.theme';
const CHECK='<svg class="svg" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
const LOOP='<svg class="svg rep" viewBox="0 0 24 24"><path d="M17 2l4 4-4 4"/><path d="M3 11V9a3 3 0 013-3h15"/><path d="M7 22l-4-4 4-4"/><path d="M21 13v2a3 3 0 01-3 3H3"/></svg>';
const mq=window.matchMedia('(max-width:700px)');
const isM=()=>mq.matches;
const pad=n=>String(n).padStart(2,'0');
const ds=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const pd=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const addDays=(s,n)=>{const d=pd(s);d.setDate(d.getDate()+n);return ds(d)};
const todayStr=()=>ds(new Date());
const hhmm=m=>pad(Math.floor(m/60))+':'+pad(m%60);
const fmt=m=>{if(!S.settings.h12)return hhmm(m);const h=Math.floor(m/60)%24,ap=h<12?'am':'pm';return (h%12||12)+(m%60?':'+pad(m%60):'')+ap};
const fd=m=>m<60?m+'m':Math.floor(m/60)+'h'+(m%60?' '+m%60+'m':'');
const uid=()=>Math.random().toString(36).slice(2,9);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const parseTime=v=>{const m=/^(\d{1,2}):(\d{2})/.exec(v||'');return m?(+m[1])*60+(+m[2]):null};
const wdShort=s=>pd(s).toLocaleDateString('en-GB',{weekday:'short'});
const nowMin=()=>{const d=new Date();return d.getHours()*60+d.getMinutes()};
const buzz=ms=>{try{navigator.vibrate&&navigator.vibrate(ms)}catch(e){}};
function isoWeek(d){const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));const n=t.getUTCDay()||7;t.setUTCDate(t.getUTCDate()+4-n);const y=new Date(Date.UTC(t.getUTCFullYear(),0,1));return Math.ceil(((t-y)/864e5+1)/7)}
function weekStart(s){const d=pd(s);d.setDate(d.getDate()-((d.getDay()+6)%7));return ds(d)}

function seed(){
  const d=todayStr(),t=(title,cat,dur,start)=>({id:uid(),title,cat,dur,date:start==null?null:d,start,sample:true});
  return {qaDur:30,qaCat:'focus',updated:0,tasks:[
    t('Plan the day','focus',30,510),t('Team standup','meeting',30,540),t('Write project brief','focus',90,570),
    t('Lunch walk','personal',45,750),t('Client call','meeting',60,840),t('Reply to emails','admin',30,930),
    t('Book dentist','admin',15,null),t('Review budget','focus',60,null),t('Call mum','personal',30,null),t('Gym','personal',60,null)]};
}
function load(){try{const j=JSON.parse(localStorage.getItem(KEY));if(j&&Array.isArray(j.tasks))return j}catch(e){}return seed()}
let S=load(),curDate=todayStr(),hist=[],view='day',lastMoved=null,lastAdded=null,lastDrag=0;
try{const v=localStorage.getItem(VKEY);if(v==='week'||v==='inbox')view=v;const th=localStorage.getItem(TKEY);if(th==='light'||th==='dark')document.documentElement.dataset.theme=th}catch(e){}
if(isM()||view==='inbox')view='day';
function normalize(){
  if(!Array.isArray(S.cats)||!S.cats.length)S.cats=DEFCATS.map(c=>({...c}));
  S.cats.forEach(c=>{delete c.ev;if(c.dur!=null&&!(c.dur>=5&&c.dur<=600))delete c.dur});
  S.settings=Object.assign({},DEFSET,S.settings);S.routines=S.routines||[];S.templates=S.templates||[];S.tasks=S.tasks||[];
  const cut=addDays(todayStr(),-45);
  S.tasks=S.tasks.filter(t=>t.start==null||t.date>=cut);
  S.routines.forEach(r=>{r.gen=(r.gen||[]).filter(d=>d>=cut)});
}
function applySettings(){const s=S.settings;DAY_START=s.dayStart;DAY_END=s.dayEnd;SNAP=s.snap}
normalize();applySettings();
const stateJson=()=>JSON.stringify({...S,updated:0});
let lastJ=stateJson();
/* per-item change stamps so two devices can merge instead of overwrite */
const itemJ=new Map();
const COLL=()=>[['t',S.tasks],['r',S.routines],['c',S.cats],['p',S.templates]];
const itemSig=x=>{const {m,...r}=x;return JSON.stringify(r)};
function baseline(){itemJ.clear();COLL().forEach(([k,arr])=>arr.forEach(x=>{if(x&&x.id)itemJ.set(k+x.id,itemSig(x))}))}
function stamp(){
  const now=Date.now();S.del=S.del||{};const seen=new Set();
  COLL().forEach(([k,arr])=>arr.forEach(x=>{
    if(!x.id)x.id=uid();const key=k+x.id;seen.add(key);const js=itemSig(x);
    if(itemJ.get(key)!==js){itemJ.set(key,js);x.m=now;delete S.del[key]}
  }));
  [...itemJ.keys()].forEach(key=>{if(!seen.has(key)){itemJ.delete(key);S.del[key]=now}});
  const cut=now-60*864e5;Object.keys(S.del).forEach(k=>{if(S.del[k]<cut)delete S.del[k]});
}
baseline();
function sig(s){return ['tasks','routines','cats','templates'].map(f=>(s[f]||[]).map(x=>x.id+':'+(x.m||0)).sort().join(',')).join('|')+'#'+Object.keys(s.del||{}).sort().join(',')}
function mergeState(a,b){
  const del={};[a.del,b.del].forEach(o=>Object.keys(o||{}).forEach(k=>{del[k]=Math.max(del[k]||0,o[k])}));
  const out=(a.updated>=b.updated)?{...b,...a}:{...a,...b};
  const pick=(k,x,y)=>{
    const map=new Map();[...(x||[]),...(y||[])].forEach(it=>{if(!it||!it.id)return;const p=map.get(it.id);
      if(!p)map.set(it.id,it);else{const win=(it.m||0)>(p.m||0)?it:p;if(it.gen||p.gen)win.gen=[...new Set([...(it.gen||[]),...(p.gen||[])])];map.set(it.id,win)}});
    return [...map.values()].filter(it=>!(del[k+it.id]!=null&&del[k+it.id]>=(it.m||0)));
  };
  const [A,B]=a.updated>=b.updated?[a,b]:[b,a];  // on equal stamps the newer document wins
  out.tasks=pick('t',A.tasks,B.tasks);out.routines=pick('r',A.routines,B.routines);out.cats=pick('c',A.cats,B.cats);out.templates=pick('p',A.templates,B.templates);
  out.del=del;out.updated=Math.max(a.updated||0,b.updated||0);return out;
}
const catOf=id=>S.cats.find(c=>c.id===id)||S.cats[0];
const kc=t=>'k-'+catOf(t.cat).color;
const scroller=$('#scroller'),grid=$('#grid'),layer=$('#blocks'),inbox=$('#inbox'),wscroller=$('#wscroller'),ag=$('#ag');

/* ---------- save + undo ---------- */
function save(){
  const j=stateJson();
  if(j!==lastJ){stamp();lastJ=stateJson();S.updated=Date.now();dirty=true;schedulePush();if(typeof gcalSoon==='function')gcalSoon()}
  try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}
}

let toastT;
function toast(msg,act,ms){
  const t=$('#toast');t.innerHTML='';const s=document.createElement('span');s.textContent=msg;t.append(s);
  if(act){const b=document.createElement('button');b.textContent=act===true?'Undo':act.label;b.onclick=()=>{if(act===true)undo();else act.fn();t.hidden=true};t.append(b)}
  t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,ms||4500);
}

/* ---------- routines ---------- */
function ensureRoutines(date){
  if(date<addDays(todayStr(),-45))return;
  S.routines.forEach(r=>{
    if(date<r.from||r.gen.includes(date))return;
    const w=pd(date).getDay();
    const ok=r.rule==='daily'||(r.rule==='weekdays'&&w>=1&&w<=5)||(r.rule==='weekly'&&w===r.dow);
    if(!ok)return;
    S.tasks.push({id:r.id+'_'+date,title:r.title,cat:r.cat,dur:r.dur,date,start:r.start,note:r.note||'',routineId:r.id});
    r.gen.push(date);
  });
}
function stopRoutine(task){
  const id=task.routineId;S.routines=S.routines.filter(r=>r.id!==id);
  S.tasks=S.tasks.filter(t=>!(t.routineId===id&&t!==task&&t.date>task.date&&!t.done));
  delete task.routineId;
}

/* ---------- grids ---------- */
function lines(host,ppm,insertBefore){
  host.querySelectorAll('.hl').forEach(e=>e.remove());
  for(let m=DAY_START;m<=DAY_END;m+=30){
    const l=document.createElement('div');l.className='hl'+(m%60?' half':'');l.style.top=(m-DAY_START)*ppm+'px';
    if(!(m%60)){const s=document.createElement('span');s.textContent=fmt(m);l.append(s)}
    insertBefore?host.insertBefore(l,insertBefore):host.append(l);
  }
}
function buildGrid(){
  lines(grid,PPM,layer);grid.style.height=(DAY_END-DAY_START)*PPM+'px';
  lines($('#wlines'),PPMW);$('#wgrid').style.height=(DAY_END-DAY_START)*PPMW+'px';
}

/* ---------- stats ---------- */
const visible=t=>t.start>=DAY_START&&t.start<DAY_END;
function dayStats(date){
  const items=S.tasks.filter(t=>t.start!=null&&t.date===date);
  const iv=items.filter(visible).map(t=>[t.start,Math.min(DAY_END,t.start+t.dur)]).sort((a,b)=>a[0]-b[0]);
  let u=0,end=-1,ov=0;
  iv.forEach(([s,e])=>{if(s<end){ov++;if(e>end){u+=e-end;end=e}}else{u+=e-s;end=e}});
  return {items,planned:u,free:DAY_END-DAY_START-u,ov,done:items.filter(t=>t.done).length,hid:items.length-iv.length};
}

/* tap "N overlaps": jump to each clash in turn and flash the two blocks */
let ovIdx=0;
function showOverlap(){
  const items=S.tasks.filter(t=>t.start!=null&&t.date===curDate&&visible(t)).sort((a,b)=>a.start-b.start||b.dur-a.dur);
  const pairs=[];let top=null;
  items.forEach(t=>{if(top&&t.start<top.start+top.dur)pairs.push([top,t]);if(!top||t.start+t.dur>top.start+top.dur)top=t});
  if(!pairs.length){toast('No overlaps');return}
  const [a,b]=pairs[ovIdx%pairs.length];ovIdx++;
  if(view!=='day'){view='day';renderAll()}
  scroller.scrollTo({top:Math.max(0,(a.start-60-DAY_START)*PPM),behavior:'smooth'});
  setTimeout(()=>[a,b].forEach(t=>{const el=layer.querySelector(`.blk[data-id="${t.id}"]`);if(el){el.classList.remove('flash');void el.offsetWidth;el.classList.add('flash')}}),250);
  toast(`${a.title} overlaps ${b.title}${pairs.length>1?` (${(ovIdx-1)%pairs.length+1} of ${pairs.length})`:''}`,false,3500);
}

function updNext(){
  const el=$('#nextup');
  if(curDate!==todayStr()||view==='week'){el.hidden=true;return}
  const m=new Date(),mm=m.getHours()*60+m.getMinutes();
  const items=S.tasks.filter(t=>t.start!=null&&t.date===curDate).sort((a,b)=>a.start-b.start);
  const curT=items.find(t=>t.start<=mm&&mm<t.start+t.dur&&!t.done);
  const nxt=items.find(t=>t.start>mm&&!t.done);
  el.hidden=false;el._t=null;
  if(curT){el.textContent=`now · ${curT.title} · ${fd(curT.start+curT.dur-mm)} left`;el._t=curT}
  else if(nxt){el.textContent=`next · ${nxt.title} at ${fmt(nxt.start)} · in ${fd(nxt.start-mm)}`;el._t=nxt}
  else if(items.length&&items.every(t=>t.done))el.textContent='everything done. nice.';
  else el.hidden=true;
}
/* touch swipe on an inbox card: left = delete, right = put in the next free slot */
function swipeCard(c,t){
  let x0=0,y0=0,on=false,dec=false;
  const col=()=>getComputedStyle($('#icards')).flexDirection==='column';
  c.addEventListener('touchstart',e=>{if(e.touches.length!==1)return;x0=e.touches[0].clientX;y0=e.touches[0].clientY;on=false;dec=false},{passive:true});
  c.addEventListener('touchmove',e=>{
    if(drag||(cur&&cur.active))return;
    const p=e.touches[0],mx=p.clientX-x0,my=p.clientY-y0;
    if(!dec){if(Math.hypot(mx,my)<10)return;dec=true;on=Math.abs(mx)>Math.abs(my)*1.4&&col();if(on)clearTimeout(cur&&cur.timer)}
    if(!on)return;
    if(e.cancelable)e.preventDefault();
    c.style.transition='none';c.style.transform='translateX('+mx+'px)';
    const k=mx<-70?'del':mx>70?'sch':'';
    if(k!==(c.dataset.sw||'')){if(k){c.dataset.sw=k;c.dataset.lbl=k==='del'?'Delete':'Schedule';buzz(8)}else{delete c.dataset.sw;delete c.dataset.lbl}}
  },{passive:false});
  const end=()=>{
    if(!on)return;on=false;const k=c.dataset.sw;
    c.style.transition='transform .35s var(--spring),opacity .25s var(--smooth)';
    const back=()=>{c.style.transform='';delete c.dataset.sw;delete c.dataset.lbl};
    if(k==='del'){c.style.transform='translateX(-115%)';c.style.opacity='0';setTimeout(()=>{pushUndo();S.tasks=S.tasks.filter(x=>x.id!==t.id);renderAll();toast('Deleted',true)},230)}
    else if(k==='sch'){
      const d=curDate,m=nextFree(d,t.dur);
      if(m==null){back();toast('No free slot of that length on this day');return}
      c.style.transform='translateX(115%)';c.style.opacity='0';
      setTimeout(()=>{pushUndo();t.date=d;t.start=m;lastMoved=t.id;renderAll();toast('Scheduled at '+fmt(m),true)},230);
    }else back();
  };
  c.addEventListener('touchend',end);c.addEventListener('touchcancel',()=>{if(on){on=false;c.style.transition='transform .35s var(--spring)';c.style.transform='';delete c.dataset.sw}});
}

function layout(items){
  items=items.slice().sort((a,b)=>a.start-b.start||b.dur-a.dur);
  const pos=new Map();let cluster=[],end=0;
  const flush=()=>{const cols=[];cluster.forEach(t=>{let c=cols.findIndex(e=>e<=t.start);if(c<0){c=cols.length;cols.push(0)}cols[c]=t.start+t.dur;pos.set(t.id,{c})});cluster.forEach(t=>pos.get(t.id).n=cols.length);cluster=[]};
  items.forEach(t=>{if(cluster.length&&t.start>=end){flush();end=0}cluster.push(t);end=Math.max(end,t.start+t.dur)});flush();
  return {items,pos};
}
function renderBlocks(dir){

}

/* ---------- focus mode ---------- */
let focusT=null;

function openFocus(t){
  closeFocus();

  const ov=document.createElement('div');ov.className='ov ovf';
  ov.innerHTML=`<div class="eyebrow" id="f-eye"></div><h2 id="f-title"></h2>
    <div class="fring"><svg viewBox="0 0 260 260"><circle class="bg" cx="130" cy="130" r="${R}"/><circle class="fg" cx="130" cy="130" r="${R}" stroke-dasharray="${C}" stroke-dashoffset="${C}"/></svg><div class="tl"><div class="big" id="f-big"></div><div class="sm2" id="f-sub"></div></div></div>
    <div class="srow" style="justify-content:center"><button class="btn leaf" id="f-done">Done</button><button class="btn" id="f-plus">+15 min</button><button class="btn" id="f-close">Close</button></div>`;
  document.body.append(ov);
  ov.querySelector('#f-title').textContent=t.title;
  const tick=()=>{
    const d=new Date(),m=d.getHours()*60+d.getMinutes()+d.getSeconds()/60,s=t.start,e=t.start+t.dur;
    let left,label,p;
    if(m<s){left=(s-m);label='starts in';p=0}else if(m<e){left=e-m;label='left';p=(m-s)/t.dur}else{left=0;label='time is up';p=1}
    const sec=Math.max(0,Math.round(left*60));
    ov.querySelector('#f-big').textContent=left<=0&&m>=e?'0:00':(sec>=3600?Math.floor(sec/3600)+':'+pad(Math.floor(sec%3600/60)):Math.floor(sec/60)+':'+pad(sec%60));
    ov.querySelector('#f-sub').textContent=label;
    ov.querySelector('#f-eye').textContent=`${catOf(t.cat).name.toLowerCase()} · ${fmt(s)}–${fmt(e)}`;
    ov.querySelector('.fg').style.strokeDashoffset=C*(1-p);
  };
  tick();focusT=setInterval(tick,1000);
  ov.querySelector('#f-close').onclick=closeFocus;
  ov.querySelector('#f-plus').onclick=()=>{pushUndo();t.dur=Math.min(t.dur+15,DAY_END-t.start);renderAll();tick()};
  ov.querySelector('#f-done').onclick=()=>{if(!t.done){pushUndo();t.done=true;buzz(8);renderAll()}closeFocus();toast('Marked done',true)};
}

/* ---------- Google Calendar: Day Blocks items live in their own "Day Blocks" calendar, edits there come back ----------
   Only that one calendar is touched (scope calendar.app.created). Nothing from your other calendars is read. */
const GC_SCOPE='https://www.googleapis.com/auth/calendar.app.created',GC_API='https://www.googleapis.com/calendar/v3';
const GKEY='day-blocks.gcal';   // per device: token, sync token, task<->event map
let GC=(()=>{try{return JSON.parse(localStorage.getItem(GKEY))||{}}catch(e){return {}}})();
GC.map=GC.map||{};
const gcSave=()=>{try{localStorage.setItem(GKEY,JSON.stringify(GC))}catch(e){}};
const gcOn=()=>!!(CFG.gcalClientId&&(GC.on||S.settings.gcal));   // the choice follows your account to other devices
const gcTokOk=()=>GC.tok&&GC.exp>Date.now()+60000;
const GCOL={leaf:'10',sky:'7',rose:'4',mustard:'5',lavender:'1',clay:'6',teal:'2',slate:'8'};
let gcBusy=false,gcT=null,gcErr='',gcTokClient=null,gcNeedTap=false;
function gcalNote(){
  if(!CFG.gcalClientId)return 'Not set up yet';
  if(!GC.on)return 'Off';
  if(gcErr)return gcErr;
  if(!gcTokOk())return 'Paused, tap to reconnect';
  return GC.last?'On · synced '+ago(GC.last):'On';
}
function ago(t){const m=Math.round((Date.now()-t)/60000);return m<1?'just now':m<60?m+' min ago':Math.round(m/60)+' h ago'}
function loadGis(){
  if(window.google&&google.accounts&&google.accounts.oauth2)return Promise.resolve();
  return new Promise((ok,no)=>{const s=document.createElement('script');s.src='https://accounts.google.com/gsi/client';s.async=true;s.onload=()=>ok();s.onerror=()=>no(new Error('Could not reach Google'));document.head.append(s)});
}
async function gcToken(interactive,hint){
  await loadGis();
  return new Promise((ok,no)=>{
    gcTokClient=google.accounts.oauth2.initTokenClient({client_id:CFG.gcalClientId,scope:GC_SCOPE,
      callback:r=>{if(r.error){no(new Error(r.error));return}GC.tok=r.access_token;GC.exp=Date.now()+(+r.expires_in||3600)*1000;gcNeedTap=false;gcSave();ok()},
      error_callback:e=>no(new Error(e&&e.type||'cancelled'))});
    gcTokClient.requestAccessToken({prompt:'',...(hint||fbUser&&fbUser.email?{login_hint:hint||fbUser.email}:{})});
  });
}
async function gapi(path,o={}){
  const r=await fetch(GC_API+path,{...o,headers:{Authorization:'Bearer '+GC.tok,'Content-Type':'application/json',...(o.headers||{})}});
  if(r.status===401){GC.exp=0;gcSave();throw Object.assign(new Error('auth'),{code:401})}
  if(r.status===410)throw Object.assign(new Error('gone'),{code:410});
  if(r.status===404&&o.method==='DELETE')return null;
  if(!r.ok){let m='';try{m=(await r.json()).error.message}catch(e){}throw Object.assign(new Error(m||('Google said '+r.status)),{code:r.status})}
  return r.status===204?null:r.json();
}
const gcTZ=()=>Intl.DateTimeFormat().resolvedOptions().timeZone;
const gcDT=(date,min)=>date+'T'+String(Math.floor(min/60)).padStart(2,'0')+':'+String(min%60).padStart(2,'0')+':00';
function gcBody(t){
  const end=t.start+t.dur,ed=end>=1440?addDays(t.date,1):t.date;
  return {summary:(t.done?'✓ ':'')+t.title,description:t.note||'',
    start:{dateTime:gcDT(t.date,t.start),timeZone:gcTZ()},end:{dateTime:gcDT(ed,end%1440),timeZone:gcTZ()},
    colorId:GCOL[catOf(t.cat).color]||undefined,extendedProperties:{private:{dbid:t.id}},reminders:{useDefault:true}};
}
const gcSig=t=>JSON.stringify([t.title,t.note||'',t.date,t.start,t.dur,!!t.done,catOf(t.cat).color]);
async function gcCalendar(){
  if(!GC.cal&&S.settings.gcalCal){GC.cal=S.settings.gcalCal;gcSave()}
  if(GC.cal)return GC.cal;
  try{const l=await gapi('/users/me/calendarList?minAccessRole=owner');const c=(l.items||[]).find(x=>x.summary==='Day Blocks');if(c){GC.cal=c.id;gcSave();return GC.cal}}catch(e){if(e.code===401)throw e}
  const c=await gapi('/calendars',{method:'POST',body:JSON.stringify({summary:'Day Blocks',description:'Blocks from the Day Blocks app. Edit them here and the app updates.',timeZone:gcTZ()})});
  GC.cal=c.id;gcSave();S.settings.gcalCal=c.id;save();return GC.cal;
}
const inWin=t=>t.start!=null&&t.date&&t.date>=addDays(todayStr(),-7)&&t.date<=addDays(todayStr(),120);
async function gcPull(cal){
  let changed=false,page=null,first=!GC.st;
  const q0=GC.st?'syncToken='+encodeURIComponent(GC.st):'timeMin='+encodeURIComponent(new Date(pd(addDays(todayStr(),-7))).toISOString())+'&singleEvents=true';
  do{
    const l=await gapi('/calendars/'+encodeURIComponent(cal)+'/events?showDeleted=true&maxResults=250&'+q0+(page?'&pageToken='+page:''));
    for(const ev of l.items||[]){
      const id=ev.extendedProperties&&ev.extendedProperties.private&&ev.extendedProperties.private.dbid;
      const t=id&&S.tasks.find(x=>x.id===id),mp=id&&GC.map[id];
      if(ev.status==='cancelled'){
        if(t&&mp&&mp.e===ev.id&&mp.s===gcSig(t)){S.tasks=S.tasks.filter(x=>x!==t);changed=true}
        if(id)delete GC.map[id];continue}
      if(!ev.start||!ev.start.dateTime)continue;   // all-day items are left alone
      const a=new Date(ev.start.dateTime),b=new Date(ev.end.dateTime);
      const f={title:(ev.summary||'Untitled').replace(/^✓\s*/,''),note:ev.description||'',date:ds(a),start:a.getHours()*60+a.getMinutes(),dur:clamp(Math.round((b-a)/60000),5,600),done:/^✓/.test(ev.summary||'')};
      if(!id){   // made straight in the Day Blocks calendar: becomes a block
        const nt={id:uid(),cat:S.qaCat||S.cats[0].id,...f};S.tasks.push(nt);changed=true;
        try{await gapi('/calendars/'+encodeURIComponent(cal)+'/events/'+encodeURIComponent(ev.id),{method:'PATCH',body:JSON.stringify({extendedProperties:{private:{dbid:nt.id}}})})}catch(e){}
        GC.map[nt.id]={e:ev.id,s:gcSig(nt),u:ev.updated};continue}
      if(!t){if(!first)continue;GC.map[id]={e:ev.id,s:'',u:ev.updated};continue}   // device has not seen that task yet; push will settle it
      if(mp&&mp.u===ev.updated)continue;   // our own write coming back
      const localEdited=mp&&mp.s!==gcSig(t);
      if(localEdited&&(t.m||0)>Date.parse(ev.updated))continue;   // newer change here wins; push sends it
      Object.assign(t,f);GC.map[id]={e:ev.id,s:gcSig(t),u:ev.updated};changed=true;
    }
    page=l.nextPageToken;if(l.nextSyncToken)GC.st=l.nextSyncToken;
  }while(page);
  return changed;
}
async function gcPush(cal){
  const live=new Map(S.tasks.filter(inWin).map(t=>[t.id,t]));
  for(const [id,t] of live){
    const mp=GC.map[id],sg=gcSig(t);
    if(mp&&mp.s===sg)continue;
    let ev=null;
    if(mp&&mp.e){try{ev=await gapi('/calendars/'+encodeURIComponent(cal)+'/events/'+encodeURIComponent(mp.e),{method:'PATCH',body:JSON.stringify(gcBody(t))})}catch(e){if(e.code!==404&&e.code!==410)throw e}}
    if(!ev){   // another device may already have made it
      const f=await gapi('/calendars/'+encodeURIComponent(cal)+'/events?privateExtendedProperty='+encodeURIComponent('dbid='+id)+'&showDeleted=false');
      const hit=(f.items||[])[0];
      ev=hit?await gapi('/calendars/'+encodeURIComponent(cal)+'/events/'+encodeURIComponent(hit.id),{method:'PATCH',body:JSON.stringify(gcBody(t))})
            :await gapi('/calendars/'+encodeURIComponent(cal)+'/events',{method:'POST',body:JSON.stringify(gcBody(t))});
    }
    GC.map[id]={e:ev.id,s:sg,u:ev.updated};
  }
  for(const id of Object.keys(GC.map)){
    if(live.has(id))continue;

    if(t&&t.start!=null&&t.date&&t.date<addDays(todayStr(),-7)){delete GC.map[id];continue}   // aged out: leave it in the calendar

/* plan my day: fit inbox tasks into the free gaps of the day you are viewing */
function planFit(items,o){
  const busy=S.tasks.filter(t=>t.start!=null&&t.date===curDate).map(t=>[t.start,t.start+t.dur]);
  let from=DAY_START;if(curDate===todayStr()&&o.from==='now')from=Math.max(from,Math.ceil((nowMin()+1)/SNAP)*SNAP);
  const g=o.gap||0,fit=[],miss=[];
  items.forEach(t=>{let at=null;
    for(let m=Math.ceil(from/SNAP)*SNAP;m+t.dur<=DAY_END;m+=SNAP){if(!busy.some(([s,e])=>m<e+g&&m+t.dur+g>s)){at=m;break}}
    if(at==null)miss.push(t);else{busy.push([at,at+t.dur]);fit.push({t,at})}});
  return {fit:fit.sort((a,b)=>a.at-b.at),miss};
}

/* "Call mum 30m at 3pm" -> title, length, start */
function parseQuick(s){
  let title=s,dur=null,start=null,m;
  const cut=r=>{title=title.replace(r,' ')};
  const tr=[/(?:\bat\s+|@\s*)(?<h>\d{1,2})(?::(?<m>\d{2}))?\s*(?<ap>am|pm)?\b/i,/\b(?<h>\d{1,2}):(?<m>\d{2})\s*(?<ap>am|pm)?/i,/\b(?<h>\d{1,2})\s*(?<ap>am|pm)\b/i];
  for(const r of tr){
    m=title.match(r);if(!m)continue;
    let h=+m.groups.h;const mi=m.groups.m?+m.groups.m:0,ap=m.groups.ap&&m.groups.ap.toLowerCase();
    if(mi>59)continue;
    if(ap){if(h<1||h>12)continue;h=h%12+(ap==='pm'?12:0)}
    else{if(h>23)continue;if(r===tr[0]&&!m.groups.m&&h>=1&&h<=6)h+=12}
    start=h*60+mi;cut(r);break;
  }
  m=title.match(/\b(\d+(?:\.\d+)?)\s*h(?:ours?|rs?)?\b(?:\s*(\d{1,2})\s*m(?:in(?:ute)?s?)?\b)?/i);
  if(m){dur=Math.round((+m[1])*60+(m[2]?+m[2]:0));cut(m[0])}
  else{m=title.match(/\b(\d{1,3})\s*m(?:in(?:ute)?s?)?\b/i);if(m){dur=+m[1];cut(m[0])}}
  if(dur!=null)dur=clamp(Math.round(dur/5)*5,5,600);
  title=title.replace(/\s+/g,' ').replace(/\s*(?:\bat|@|for)\s*$/i,'').trim();
  if(!title)return {title:s.trim(),dur:null,start:null};
  return {title,dur,start};
}

const FBQ='day-blocks.fbq',FBME='day-blocks.fbme';
const platformName=()=>isIOS()?'iOS':isAndroid()?'Android':/Mac/i.test(navigator.userAgent)?'Mac':/Win/i.test(navigator.userAgent)?'Windows':'Other';
function shapeSet(b,i,cls){[...b.querySelectorAll('.l')].forEach((x,k)=>{x.classList.toggle('on',k===i);x.setAttribute('aria-hidden',String(k!==i))});b.classList.remove('arm','gone','sent');if(cls)b.classList.add(cls===true?'arm':cls)}
async function postFeedback(p){
  if(!CFG.feedbackUrl)throw new Error('nourl');
  await fetch(CFG.feedbackUrl,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(p)});
}
function queueFeedback(p){try{const q=JSON.parse(localStorage.getItem(FBQ)||'[]');q.push(p);localStorage.setItem(FBQ,JSON.stringify(q.slice(-20)))}catch(e){}}
async function flushFeedback(){
  let q=[];try{q=JSON.parse(localStorage.getItem(FBQ)||'[]')}catch(e){}
  if(!q.length||!CFG.feedbackUrl||!navigator.onLine)return;
  const left=[];for(const p of q){try{await postFeedback(p)}catch(e){left.push(p)}}
  try{left.length?localStorage.setItem(FBQ,JSON.stringify(left)):localStorage.removeItem(FBQ)}catch(e){}
}
function openHelp(){
  closeSheet();
  let me={};try{me=JSON.parse(localStorage.getItem(FBME)||'{}')}catch(e){}
  const ov=mkOverlay(`<div class="sheet" role="dialog" aria-modal="true" aria-label="Help and feedback"><h3>Help and feedback</h3>
    <div class="pills" id="fb-type" aria-label="Kind of feedback"></div>
    <div class="fld"><label for="fb-msg" id="fb-lbl"></label><textarea id="fb-msg" class="fbtxt" maxlength="4000"></textarea></div>
    <div class="row2"><div class="fld"><label for="fb-name">Your name</label><input id="fb-name" maxlength="60" autocomplete="given-name"></div><div class="fld"><label for="fb-ct">Reply to</label><input id="fb-ct" maxlength="120" placeholder="Optional" autocomplete="email"></div></div>
    <p class="note">Sends your note with the app version and device type. Your plans and tasks are not sent.</p>
    <p class="errmsg" id="fb-err" hidden></p>
    <div class="srow"><button class="btn grow" data-a="close" type="button">Close</button><button class="btn leaf grow shc" data-a="send" type="button"><span class="l on">Send</span><span class="l" aria-hidden="true">Sending…</span><span class="l" aria-hidden="true">Sent. Thank you</span></button></div>
    <hr>
    <div class="hlist"><button type="button" data-a="tour"><span>Replay the tour<small>A 30 second look round</small></span></button><button type="button" data-a="install"><span>Add to home screen<small>Use it like an app</small></span></button><button type="button" data-a="acct"><span>Account and sync<small>${fbUser?'Signed in':'Use it on more than one device'}</small></span></button></div>
    <p class="kbd" style="text-align:center">Day Blocks ${APP_VER}</p></div>`);
  const q=s=>ov.querySelector(s),msg=q('#fb-msg'),send=q('[data-a=send]');
  const TYPES={bug:['Bug','What went wrong?','What did you do, what happened, and what did you expect?'],idea:['Idea','What would make it better?','A feature, a change, something that annoys you…'],other:['Other','Your message','Anything else']};
  let kind='bug';
  const paintT=()=>{q('#fb-lbl').textContent=TYPES[kind][1];msg.placeholder=TYPES[kind][2]};
  pills(q('#fb-type'),Object.keys(TYPES),kind,k=>TYPES[k][0],v=>{kind=v;paintT()});paintT();
  q('#fb-name').value=me.name||'';q('#fb-ct').value=me.contact||(fbUser&&fbUser.email)||'';
  msg.addEventListener('input',()=>{q('#fb-err').hidden=true});
  let sending=false;
  const doSend=async()=>{
    if(sending)return;const text=msg.value.trim();
    if(!text){const e=q('#fb-err');e.textContent='Write a few words first.';e.hidden=false;msg.focus();return}
    const name=q('#fb-name').value.trim(),contact=q('#fb-ct').value.trim();
    try{localStorage.setItem(FBME,JSON.stringify({name,contact}))}catch(e){}
    const p={type:TYPES[kind][0],message:text,name,contact,app:APP_VER,platform:platformName(),installed:isStandalone()?'yes':'no',
      screen:innerWidth+'x'+innerHeight+'@'+(devicePixelRatio||1),view,signedIn:fbUser?'yes':'no',lang:navigator.language||'',ua:navigator.userAgent,sentAt:new Date().toISOString()};
    if(!CFG.feedbackUrl){   // no sheet set up yet: hand it to the share sheet or clipboard instead
      const body=`Day Blocks ${p.type}\n\n${text}\n\n${name?'From: '+name+'\n':''}${contact?'Reply to: '+contact+'\n':''}${p.platform} · ${p.screen} · v${APP_VER}`;
      try{if(navigator.share){await navigator.share({title:'Day Blocks feedback',text:body});closeSheet();return}}catch(e){if(e&&e.name==='AbortError')return}
      try{await navigator.clipboard.writeText(body);toast('Copied. Paste it in a message to send it.')}catch(e){toast('Could not send. Try again later.')}
      return;
    }
    sending=true;shapeSet(send,1);buzz(8);
    try{
      if(!navigator.onLine)throw new Error('offline');
      await postFeedback(p);
      shapeSet(send,2,'sent');buzz([8,60,8]);msg.value='';
      setTimeout(()=>{if(ov.isConnected)closeSheet()},1600);
    }catch(e){
      queueFeedback(p);shapeSet(send,2,'sent');send.querySelectorAll('.l')[2].textContent='Saved. Sends when online';msg.value='';
      setTimeout(()=>{if(ov.isConnected)closeSheet()},2200);
    }finally{sending=false}
  };
  ov.addEventListener('click',e=>{
    if(e.target===ov){closeSheet();return}
    const a=e.target.closest('[data-a]');if(!a)return;const k=a.dataset.a;
    if(k==='close')closeSheet();else if(k==='send')doSend();

  });
  sheetKey=e=>{if(e.key==='Escape')closeSheet()};document.addEventListener('keydown',sheetKey);
  if(!isM())msg.focus();
}

/* ---------- first-visit tour (spotlight + stretching dots + shared-axis steps) ---------- */
const TOUR_KEY='day-blocks.tour';
let tour=null;
function tourSteps(){
  const m=isM();
  const st=[
    {t:null,eb:'welcome',h:'Plan your day in blocks',p:'A quick look round. It takes about 30 seconds.'},
    {t:'#tl',h:'This is your day',p:m?'Tap an empty slot to add a block. Hold, then drag down to set how long it lasts.':'Click an empty slot to add a block. Press and drag down to set how long it lasts.'},

    {t:'#inbox',h:'Inbox',p:m?'Tasks without a time wait here. Hold one and drag it onto the day. Swipe left to delete, right to drop it in the next free slot.':'Tasks without a time wait here. Drag one onto the day, or drag a block back here to take it off the day.'},

    {t:m?'#dstrip':'.dnav',h:'Other days',p:m?'Tap a day, or swipe the timeline left or right.':'Use the arrows or the ← → keys. Week shows all seven days.'},
    {t:m?'#tabMore':'#more',h:'Templates and sync',p:'Save a day you like as a template and reuse it. Sign in here to keep your plans the same on every device.'},
    {t:'#helpBtn',h:'Tell us what you think',p:'Found a bug or want a feature? Tap ? and send it in a few seconds.'},
  ];

}
function startTour(){
  closeSheet();document.querySelectorAll('.ov').forEach(o=>o.remove());endTour(true);
  if(view!=='day'){view='day';renderAll()}
  if(curDate!==todayStr())setDay(todayStr());
  const el=document.createElement('div');el.className='tour';el.setAttribute('role','dialog');el.setAttribute('aria-modal','true');el.setAttribute('aria-label','Tour');
  el.innerHTML='<div class="catch"></div><div class="tspot"></div><div class="tcard"><div class="tbody" aria-live="polite"></div><div class="tfoot"><div class="tdots" aria-hidden="true"></div><button class="skip" type="button" data-t="skip">Skip</button><button class="btn" type="button" data-t="back">Back</button><button class="btn leaf" type="button" data-t="next">Next</button></div></div>';
  document.body.append(el);
  tour={el,steps:tourSteps(),i:-1};
  tour.steps.forEach(()=>el.querySelector('.tdots').append(document.createElement('i')));
  el.addEventListener('click',async e=>{
    const b=e.target.closest('[data-t]');if(!b)return;const k=b.dataset.t;
    if(k==='skip')endTour();else if(k==='back')tourGo(tour.i-1);
    else if(k==='inst'){if(await doInstall())endTour();else tourGo(tour.i,true)}
    else if(k==='next'){if(tour.i>=tour.steps.length-1)endTour();else tourGo(tour.i+1)}
  });
  el.addEventListener('keydown',e=>{if(e.key==='Escape')endTour();else if(e.key==='ArrowRight')el.querySelector('[data-t=next]').click();else if(e.key==='ArrowLeft'&&tour.i>0)tourGo(tour.i-1)});
  tour.onResize=()=>tourPlace();window.addEventListener('resize',tour.onResize);
  requestAnimationFrame(()=>{el.classList.add('on');tourGo(0)});
}
function tourTarget(s){if(!s.t)return null;const x=typeof s.t==='function'?s.t():document.querySelector(s.t);if(!x)return null;const r=x.getBoundingClientRect();return r.width&&r.height?x:null}
function tourGo(i,same){
  if(!tour)return;const {el,steps}=tour;
  // skip steps whose element is not on screen (e.g. no blocks left)
  const dir=i>=tour.i?1:-1;while(i>0&&i<steps.length&&steps[i].t&&!tourTarget(steps[i]))i+=dir;
  if(i<0||i>=steps.length){endTour();return}
  const prev=tour.i;tour.i=i;const s=steps[i],body=el.querySelector('.tbody');
  const fill=()=>{
    body.innerHTML=(s.eb?'<p class="eyebrow"></p>':'')+'<h3></h3>'+(s.install?installHTML(installPlat()):'<p></p>');
    if(s.eb)body.querySelector('.eyebrow').textContent=s.eb;body.querySelector('h3').textContent=s.h;if(!s.install)body.querySelector('p:last-child').textContent=s.p;
    const nx=el.querySelector('[data-t=next]'),last=i===steps.length-1;
    nx.textContent=last?(s.install?'Later':'Done'):i===0?'Start':'Next';
    el.querySelector('[data-t=back]').hidden=i===0;el.querySelector('[data-t=skip]').hidden=last;
    let ib=el.querySelector('[data-t=inst]');
    if(s.install&&deferredInstall&&!isStandalone()){if(!ib){ib=document.createElement('button');ib.type='button';ib.className='btn leaf';ib.dataset.t='inst';ib.textContent='Install';nx.after(ib)}nx.classList.remove('leaf')}
    else{if(ib)ib.remove();nx.classList.add('leaf')}
    if(s.install&&!deferredInstall)nx.textContent='Done';
    [...el.querySelectorAll('.tdots i')].forEach((d,k)=>d.className=k<i?'d':k===i?'c':'');
  };
  const tg=tourTarget(s);
  if(tg&&tg.closest('#scroller')){tg.scrollIntoView({block:'center',behavior:'instant'})}
  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(prev<0||same||reduce){fill();tourPlace();el.querySelector('[data-t=next]').focus({preventScroll:true});return}
  const fw=i>prev;body.classList.remove('in-r','in-l','out-l','out-r');void body.offsetWidth;body.classList.add(fw?'out-l':'out-r');
  tourPlace();buzz(4);
  setTimeout(()=>{if(!tour)return;fill();body.classList.remove('out-l','out-r');void body.offsetWidth;body.classList.add(fw?'in-r':'in-l');tourPlace();el.querySelector('[data-t=next]').focus({preventScroll:true})},200);
}
function tourPlace(){
  if(!tour)return;const {el,steps,i}=tour,s=steps[i],spot=el.querySelector('.tspot'),card=el.querySelector('.tcard');
  const vw=innerWidth,vh=innerHeight,tg=tourTarget(s),ch=card.offsetHeight;
  card.style.left=card.style.right=card.style.width=card.style.margin='';
  if(!tg){spot.classList.add('c');spot.style.cssText=`left:${vw/2-1}px;top:${vh/2-1}px;width:2px;height:2px`;card.style.top=Math.max(16,(vh-ch)/2)+'px';return}
  spot.classList.remove('c');
  const r=tg.getBoundingClientRect(),pad=6;
  const L=Math.max(4,r.left-pad),T=Math.max(4,r.top-pad),R=Math.min(vw-4,r.right+pad),B=Math.min(vh-4,r.bottom+pad);
  spot.style.cssText=`left:${L}px;top:${T}px;width:${R-L}px;height:${B-T}px;border-radius:${Math.min(16,(B-T)/2)}px`;
  const below=vh-B,above=T,gap=12;
  let top;
  if(below>=ch+gap+8)top=B+gap;else if(above>=ch+gap+8)top=T-gap-ch;else top=below>above?vh-ch-16:16;
  card.style.top=clamp(top,8,vh-ch-8)+'px';
  if(vw>700){
    const cw=Math.min(380,vw-32),side=below<ch+gap+8&&above<ch+gap+8;
    card.style.width=cw+'px';card.style.right='auto';card.style.margin='0';
    if(side&&vw-R>=cw+28){card.style.left=R+gap+'px';card.style.top=clamp(r.top+r.height/2-ch/2,16,vh-ch-16)+'px'}        // tall target: sit beside it
    else if(side&&L>=cw+28){card.style.left=L-gap-cw+'px';card.style.top=clamp(r.top+r.height/2-ch/2,16,vh-ch-16)+'px'}
    else card.style.left=clamp(r.left+r.width/2-cw/2,16,vw-cw-16)+'px';
  }
}
function endTour(silent){
  if(!tour)return;const t=tour;tour=null;window.removeEventListener('resize',t.onResize);
  t.el.classList.remove('on');t.el.style.transition='opacity .3s var(--smooth)';t.el.style.opacity='0';setTimeout(()=>t.el.remove(),300);

  navigator.serviceWorker.addEventListener('controllerchange',()=>{if(reloading||!hadSW)return;reloading=true;location.reload()});
  navigator.serviceWorker.register('sw.js').then(reg=>{
    const ready=w=>{if(w&&navigator.serviceWorker.controller)showUpdate(w)};
    if(reg.waiting)ready(reg.waiting);
    reg.addEventListener('updatefound',()=>{const w=reg.installing;if(w)w.addEventListener('statechange',()=>{if(w.state==='installed')ready(w)})});
    document.addEventListener('visibilitychange',()=>{if(!document.hidden)reg.update().catch(()=>{})});
  }).catch(()=>{});
}

/* ---------- start ---------- */
buildGrid();paintQuick();renderAll();flushFeedback();requestAnimationFrame(scrollToRelevant);
{
  const late=()=>S.tasks.filter(t=>t.start!=null&&t.date<todayStr()&&!t.done&&!t.routineId&&!t.sample);
  const n=late().length;
  let toured=true;try{toured=!!localStorage.getItem(TOUR_KEY)}catch(e){}
  const qs=new URLSearchParams(location.search);
  if(qs.has('new')){history.replaceState(null,'',location.pathname);if(toured)setTimeout(()=>openSheet(null),300)}
  if(!toured)setTimeout(startTour,700);
  else if(n)toast(`${n} unfinished from earlier days`,{label:'Move to today',fn:()=>{const l=late();if(l.length){pushUndo();l.forEach(t=>t.date=todayStr());renderAll()}}},9000);
}
initSync();
/* ---------- resizable inbox sidebar (browser / iPad landscape) ---------- */
{
  const IWKEY='day-blocks.inboxWidth',mainEl=document.querySelector('main'),h=document.getElementById('iresize');
  const MIN=200,DEF=228,maxW=()=>Math.max(MIN,Math.min(560,Math.round(window.innerWidth*0.45)));
  const setW=(w,save)=>{w=Math.round(Math.min(maxW(),Math.max(MIN,w)));mainEl.style.setProperty('--iw',w+'px');h.setAttribute('aria-valuenow',w);if(save)try{localStorage.setItem(IWKEY,String(w))}catch(e){}return w};
  h.hidden=false;
  try{const s=parseInt(localStorage.getItem(IWKEY),10);if(s)setW(s,false)}catch(e){}
  let x0=0,w0=0,on=false;
  h.addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();on=true;x0=e.clientX;w0=inbox.getBoundingClientRect().width;h.classList.add('on');document.body.classList.add('iresizing');try{h.setPointerCapture(e.pointerId)}catch(_){}});
  h.addEventListener('pointermove',e=>{if(on)setW(w0+e.clientX-x0,false)});
  const end=()=>{if(!on)return;on=false;h.classList.remove('on');document.body.classList.remove('iresizing');setW(inbox.getBoundingClientRect().width,true)};
  h.addEventListener('pointerup',end);h.addEventListener('pointercancel',end);
  h.addEventListener('dblclick',()=>{mainEl.style.removeProperty('--iw');try{localStorage.removeItem(IWKEY)}catch(e){}});
  h.addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();setW(inbox.getBoundingClientRect().width+(e.key==='ArrowRight'?16:-16),true)}});
  window.addEventListener('resize',()=>{const v=parseInt(mainEl.style.getPropertyValue('--iw'),10);if(v&&v>maxW())setW(maxW(),false)});
}
})();
